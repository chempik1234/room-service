version: '3'

tasks:
  grpc:
    cmds:
      - protoc -I .
        --go_out=./room_service
        --go-grpc_out=./room_service
        ./api/room_service/room_service.proto
      - protoc -I .
        --go_out=./integration_tests/happy_test
        --go-grpc_out=./integration_tests/happy_test
        ./api/room_service/room_service.proto
    summary: Generate gRPC code from protofile - to all users of it

  lint:
    dir: ./room_service
    cmds:
      - golangci-lint run ./... --config ../golangci-lint.yml
    summary: Lint the code with golangci-lint

  init_env:
    dir: ./room_service
    cmds:
      - go run ./scripts --filepath=../config/.env.init
    summary: init env file with variables used by golang code

  up:
    cmds:
      - docker compose -f docker/docker-compose.yaml up -d
    summary: docker compose up with -d

  down:
    cmds:
      - docker compose -f docker/docker-compose.yaml down
    summary: docker compose down

  build:
    cmds:
      - docker compose -f docker/docker-compose.yaml build
    summary: build all for docker compose

  test:
    cmds:
      - docker compose -f integration_tests/test-compose.yaml up -d room_service redis mongodb
      - docker compose -f integration_tests/test-compose.yaml up --build happy_test
      - docker compose -f integration_tests/test-compose.yaml down
    summary: Run all tests